services:
  - type: web
    name: tenetdrill-api
    env: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: tenetdrill-ui
    env: static
    plan: free
    staticPublishPath: ./ui
    buildCommand: ""
    # ui/env.js has no build-time env substitution (plain static site, no
    # Vite step) -- after tenetdrill-api deploys, edit ui/env.js's
    # window.TENETDRILL_API_URL to that service's URL and redeploy, or wire
    # a tiny build step here (e.g. `sed`) to template it from $API_URL.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
